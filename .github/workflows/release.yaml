name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            binary: netbird-pam-x86_64
          - goarch: arm64
            binary: netbird-pam-aarch64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod

      - name: Build ${{ matrix.binary }}
        env:
          NETBIRD_TOKEN: ${{ secrets.NETBIRD_TOKEN }}
          NETBIRD_API: ${{ vars.NETBIRD_MANAGEMENT_URL }}
          NETBIRD_IP_PREFIX: ${{ vars.NETBIRD_IP_PREFIX }}
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} go build \
            -ldflags "-s -w \
              -X main.netbirdToken=${NETBIRD_TOKEN} \
              -X main.netbirdAPI=${NETBIRD_API} \
              -X main.netbirdPrefix=${NETBIRD_IP_PREFIX}" \
            -o ${{ matrix.binary }} \
            ./main.go

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          generate_release_notes: true
          files: |
            netbird-pam-x86_64/netbird-pam-x86_64
            netbird-pam-aarch64/netbird-pam-aarch64